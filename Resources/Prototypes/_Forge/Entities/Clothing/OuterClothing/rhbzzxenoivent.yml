- type: entity
  parent: [ClothingOuterHardsuitBase, ClothingFlightProfileEasy] 
  id: ClothingOuterHardsuitRCHBZD14
  name: ent-ClothingOuterHardsuitRCHBZD14-name
  description: ent-ClothingOuterHardsuitRCHBZD14-desc
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/cburn.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Hardsuits/cburn.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ExplosionResistance
    damageCoefficient: 0.25 
  - type: FireProtection 
    reduction: 0.2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.50 
        Heat: 0.35 
        Cold: 0.3
        Shock: 0.3
        Radiation: 0.15 
        Caustic: 0.6
  - type: ClothingSpeedModifier 
    walkModifier: 0.94 
    sprintModifier: 0.94
  - type: Reflect 
    reflectProb: 0.25 
    damageOnReflectModifier: 0 
    reflects: 
      - Energy 
  - type: HeldSpeedModifier
  - type: StaminaDamageResistance 
    coefficient: 0.25 
  - type: ToggleableClothing 
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetCBURN
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock


