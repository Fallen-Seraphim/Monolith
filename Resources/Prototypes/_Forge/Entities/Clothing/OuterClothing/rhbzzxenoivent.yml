- type: entity
  parent: [ClothingOuterHardsuitBase, ClothingFlightProfileEasy] 
  id: ClothingOuterHardsuitRCHBZD14
  name: RCHBZD exosuit M14
  description: A lightweight yet strong exosuit used for special cleanup NanoTrasen operations.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/cburn.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Hardsuits/cburn.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ExplosionResistance
    damageCoefficient: 0.25 
  - type: FireProtection 
    reduction: 0.2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.50 
        Heat: 0.35 
        Cold: 0.3
        Shock: 0.3
        Radiation: 0.15 
        Caustic: 0.6
  - type: ClothingSpeedModifier 
    walkModifier: 0.94 
    sprintModifier: 0.94
  - type: Reflect 
    reflectProb: 0.25 
    damageOnReflectModifier: 0 
    reflects: 
      - Energy 
  - type: HeldSpeedModifier
  - type: StaminaDamageResistance 
    coefficient: 0.25 
  - type: ToggleableClothing 
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetCBURN
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock


- type: entity
  parent: ClothingOuterHardsuitRCHBZD14
  id: ClothingOuterHardsuitRCHBZD14H
  name: RCHBZD exosuit M14H
  description: A heavy and strong exosuit used for special cleanup NanoTrasen operations.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.4
        Heat: 0.35 
        Cold: 0.3
        Shock: 0.3
        Radiation: 0.15 
        Caustic: 0.3
  - type: ClothingSpeedModifier 
    walkModifier: 0.9 
    sprintModifier: 0.9


