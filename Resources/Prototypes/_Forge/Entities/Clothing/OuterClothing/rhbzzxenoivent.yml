- type: entity
  parent: ComputerComms
  id: ComputerCommsRCHZBD
  suffix: FallenSeraphim
  name: RCHBZD NT comms
  description: A computer used to make station wide announcements via keyboard, set the appropriate alert level, and call the emergency shuttle.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [["Command"]]
  - type: CommunicationsConsole
    title: РХБЗЗ NanoTrasen # Не уверен, что все поймут RCHBZD, а остольное менять лень
    color: "#5D4776FF"
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#5D4776FF"


