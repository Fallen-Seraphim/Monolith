- type: reagent
  id: NeuroAcidCobra
  name: reagent-name-neuroacid-cobra
  group: Toxins
  desc: reagent-desc-neuroacid-cobra
  physicalDesc: reagent-physical-desc-cloudy
  flavor: smokey
  color: "#855395FF"
  boilingPoint: 255.0
  meltingPoint: 36.0
  metabolisms:
    Poison:
      metabolismRate: 0.5
      effects:
      - !type:PopupMessage
        type: Local
        messages:
        - neuroacid-effect-second
        - neuroacid-effect-first
        - neuroacid-effect-third
        - neuroacid-effect-fourth
        probability: 0.7
        conditions:
        - !type:ReagentThreshold
          max: 30
      - !type:StaminaDamageEffect
        forceCrit: true
        conditions:
        - !type:ReagentThreshold
          min: 9
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Yowie
          shouldHave: false
        damage:
          types:
            Poison: 1
      - !type:TunnelVision
        intensity: 0.9
        pulse: 1.7
        darkness: 0.8
        color: "#855395FF"
        time: 3
        conditions:
        - !type:ReagentThreshold
          min: 10
      - !type:Oxygenate
        factor: -1
        conditions:
        - !type:ReagentThreshold
          min: 9
    Narcotic:
      effects:
      - !type:MovespeedModifier
        walkSpeedModifier: 0.8
        sprintSpeedModifier: 0.8
      - !type:Jitter
 
 
